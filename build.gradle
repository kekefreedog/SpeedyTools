buildscript {
    repositories {
        maven { url = "https://repo.maven.apache.org/maven2/" }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

sourceCompatibility = 1.8
targetCompatibility = 1.8

version = "4.6.4"
group= "com.thegreyghost.speedytoolsmod" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "speedytoolsmod"

minecraft {
    version = "1.8-11.14.3.1450" // "1.8-11.14.1.1334"
    assetDir = "eclipse/assets"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not allways work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "snapshot_nodoc_20141130"
}

// Mojang retired the old s3.amazonaws.com/Minecraft.Download endpoints that this
// version of ForgeGradle (1.2) hardcodes. Point the relevant tasks at the current
// official Mojang piston-meta/launcher.mojang.com endpoints for Minecraft 1.8 instead.
afterEvaluate {
    // Gradle 2 / ForgeGradle 1.2 add HTTP repositories internally. Modern hosts
    // reject HTTP or redirect it with status codes this Gradle cannot follow.
    repositories.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).all { repository ->
        String address = repository.url.toString()
        if (address.contains('repo1.maven.org/maven2')) {
            repository.url = 'https://repo.maven.apache.org/maven2/'
        } else if (address.contains('files.minecraftforge.net/maven')) {
            repository.url = 'https://maven.minecraftforge.net/'
        } else if (address.startsWith('http://')) {
            repository.url = 'https://' + address.substring('http://'.length())
        }
    }
    tasks.getByName('downloadClient').url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, 'https://launcher.mojang.com/v1/objects/d722504db9de2b47f46cc592b8528446272ae648/client.jar')
    tasks.getByName('downloadServer').url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, 'https://launcher.mojang.com/v1/objects/a028f00e678ee5c6aef0e29656dca091b5df11c7/server.jar')
    tasks.getByName('getVersionJson').url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, 'https://piston-meta.mojang.com/v1/packages/9eb165eef46294062d8698c8a78e8ac914949e7a/1.8.json')
    tasks.getByName('getAssetsIndex').url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, 'https://launchermeta.mojang.com/v1/packages/f6ad102bcaa53b1a58358f16e376d548d44933ec/1.8.json')
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.+'
    compile "org.objenesis:objenesis:2.1"
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

test {
    exclude '*'
}

// Run the template regression suite explicitly; preserve the legacy test task's exclusions.
task templateTest(type: Test, dependsOn: testClasses) {
    testClassesDir = sourceSets.test.output.classesDir
    classpath = sourceSets.test.runtimeClasspath
    include 'speedytools/templates/*Test.class'
    enableAssertions = true
    workingDir = file("$buildDir/template-test")
    doFirst { workingDir.mkdirs() }
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}


sourceSets { main { output.resourcesDir = output.classesDir } }
