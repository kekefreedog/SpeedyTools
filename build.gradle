buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "4.1.1"
group= "com.thegreyghost.speedytoolsmod" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "speedytoolsmod"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    // NOTE(forge-1.8.9-migration): FG 1.2's "assetDir" property doesn't exist on FG 2.1's
    // extension anymore; FG 2.x uses "runDir" (where runClient/runServer execute) instead.
    runDir = "run"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not allways work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    // Confirmed via de.oceanlabs.mcp:mcp_stable maven-metadata.xml: version "22-1.8.9" is
    // the stable MCP mapping build purpose-made for MC 1.8.9 (as opposed to the old
    // snapshot_nodoc_20141130, which predates 1.8.9 and left WorldRenderer mostly
    // unmapped - see forge-1.8.9-migration branch history).
    mappings = "stable_22"
}

// NOTE(forge-1.8.9-migration): FG 1.2 needed an afterEvaluate override here for
// downloadClient/downloadServer/getVersionJson/getAssetsIndex because it hardcoded
// dead s3.amazonaws.com/Minecraft.Download URLs, and used a
// net.minecraftforge.gradle.delayed.DelayedString class that no longer exists under
// FG 2.1 (package restructured). Removed - see whether FG 2.1 needs an equivalent
// workaround; if so it must target FG 2.1's actual task/class names, not FG 1.2's.

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.+'
    compile "org.objenesis:objenesis:2.1"
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

test {
    exclude '*'
}

// NOTE: mcmod.info's "mcversion" field is cosmetic only (shown in the Mods list) - it does
// NOT control FML's actual load-time compatibility gate. That gate is driven entirely by
// @Mod(acceptedMinecraftVersions=...) in SpeedyToolsMod.java (verified by disassembling
// Forge's FMLModContainer.bindMetadata: if that annotation attribute is blank, FML falls
// back to the exact Minecraft version the Forge build itself targets - "1.8" for our pinned
// 1.8-11.14.3.1450 - producing range [1.8,1.8] regardless of mcmod.info). Keep this in sync
// with the acceptedMinecraftVersions value in SpeedyToolsMod.java.
ext.mcversionDeclared = "[1.8,1.8.9]"

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", mcversionDeclared

    // NOTE(forge-1.8.9-migration): previously this used two separate from() blocks (one
    // include:'mcmod.info' + expand, one exclude:'mcmod.info' for everything else). Under
    // FG 2.1/Gradle 2.12 the exclude in the 2nd block stopped taking effect, so mcmod.info got
    // copied twice - once expanded, once raw - which made FG's stricter reobfJar task fail with
    // "duplicate entry: mcmod.info" (the plain jar task tolerated it silently). filesMatching()
    // is the more robust, single-from-block way to expand just one file: no duplicate source,
    // nothing to deduplicate.
    from(sourceSets.main.resources.srcDirs)
    filesMatching('mcmod.info') {
        expand 'version':project.version, 'mcversion':mcversionDeclared
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets { main { output.resourcesDir = output.classesDir } }
